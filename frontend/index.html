<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Login Form -->
    <div class="form-container" id="loginForm">
      <div class="form-header">
        <h1>Login</h1>
        <p>Welcome back!</p>
      </div>

      <form id="loginFormElement">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input 
            type="text" 
            id="login-username" 
            name="username" 
            placeholder="Enter your username"
            required
          >
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input 
            type="password" 
            id="login-password" 
            name="password" 
            placeholder="Enter your password"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <div class="form-footer">
        <p>Don't have an account? 
          <a href="#" onclick="toggleForm(event)">Register here</a>
        </p>
      </div>

      <div id="loginMessage" class="message"></div>
    </div>

    <!-- Register Form -->
    <div class="form-container hidden" id="registerForm">
      <div class="form-header">
        <h1>Register</h1>
        <p>Create your account</p>
      </div>

      <form id="registerFormElement">
        <div class="form-group">
          <label for="register-username">Username</label>
          <input 
            type="text" 
            id="register-username" 
            name="username" 
            placeholder="Choose a username"
            required
          >
        </div>

        <div class="form-group">
          <label for="register-email">Email</label>
          <input 
            type="email" 
            id="register-email" 
            name="email" 
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <label for="register-password">Password</label>
          <input 
            type="password" 
            id="register-password" 
            name="password" 
            placeholder="Create a password"
            required
          >
        </div>

        <div class="form-group">
          <label for="register-confirm">Confirm Password</label>
          <input 
            type="password" 
            id="register-confirm" 
            name="confirmPassword" 
            placeholder="Confirm your password"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary">Register</button>
      </form>

      <div class="form-footer">
        <p>Already have an account? 
          <a href="#" onclick="toggleForm(event)">Login here</a>
        </p>
      </div>

      <div id="registerMessage" class="message"></div>
    </div>

    <!-- User Dashboard (shown after login) -->
    <div class="form-container hidden" id="dashboard">
      <div class="form-header">
        <h1>Dashboard</h1>
        <p id="welcomeMessage"></p>
      </div>

      <div class="user-info">
        <h3>Your Profile</h3>
        <p><strong>ID:</strong> <span id="userId"></span></p>
        <p><strong>Username:</strong> <span id="dashboardUsername"></span></p>
        <p><strong>Email:</strong> <span id="dashboardEmail"></span></p>
      </div>

      <button type="button" class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
